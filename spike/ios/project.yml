name: CommuneSpike
options:
  bundleIdPrefix: be.communesolutions.spike
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: TJ2759P685
    CODE_SIGN_STYLE: Automatic
packages:
  CommuneRenderer:
    path: ../../core/renderer-ios
targets:
  CommuneSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../modules-official
        buildPhase: resources
        type: folder
      - path: ../../modules-community
        buildPhase: resources
        type: folder
      - path: ../../tenants
        buildPhase: resources
        type: folder
      - path: ../../core/firebase
        buildPhase: resources
        type: folder
    dependencies:
      - package: CommuneRenderer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Commune Spike
        # Tenant baké au build : SpikeApp lit ces deux clés au démarrage.
        # Vides = mode multi-tenant dev (picker). Set = mode single-commune.
        # `tools/build-commune-app.sh` patche ces valeurs en générant un
        # `project.commune.yml` dérivé avant xcodegen.
        CommuneTenantID: ""
        CommuneFirebaseProjects: ""
        # Si non vide, Auth + Firestore SDK pointent sur les emulators
        # locaux (ports 9099 + 8080). Set par tools/dev-emulators.sh
        # via env var pour le build dev. Vide en build prod / commune.
        FirebaseEmulatorHost: ""
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Spike: dev HTTP server (python3 -m http.server). Production drops this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Phase 17 — primitive d'action `device.location` pour les form
        # citoyens (signalements voirie, proposer un POI, etc.). Hardcodé
        # ici en attendant l'aggregation au build commune (phase 18.4).
        NSLocationWhenInUseUsageDescription: "Pour pré-remplir le lieu d'un signalement ou d'une proposition citoyenne avec votre position actuelle."
        # Notifications push (broadcast v0). UIBackgroundModes
        # remote-notification permet de réveiller l'app pour un silent push
        # (utile pour rafraîchir un contenu en arrière-plan plus tard).
        # L'entitlement aps-environment est dans CommuneSpike.entitlements.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: be.communesolutions.spike
        CODE_SIGN_ENTITLEMENTS: CommuneSpike.entitlements
schemes:
  CommuneSpike:
    build:
      targets:
        CommuneSpike: all
    run:
      config: Debug
